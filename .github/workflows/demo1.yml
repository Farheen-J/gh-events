name: Events Demo 1
on:  #[push, workflow_dispatch] #Any push will trigger this workflow, what if we just need this to be triggered for main branch
  pull_request: # Event 1
    types:
      - opened # Activity type
      - edited
  workflow_dispatch: # Event 2 without activity type
jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - name: "Get Code"
        uses: actions/checkout@v3
      - name: "Install Dependencies"
        run: npm ci 
      # - name: "Executing Lint"
      #   run: npm run lint
      - name: "Executing test cases"
        run: npm test
      - name: "Deploy"
        run: echo "Deploying...."
